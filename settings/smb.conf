[global]
    server role = standalone server
    netbios name = SC-CENTRAL
    server min protocol = SMB2_02
    smb ports = 445
    disable netbios = yes
    map to guest = Never
    load printers = no
    disable spoolss = yes
    printing = bsd
    printcap name = /dev/null

[NAS]
    path = /Data/Share
    read only = no
    guest ok = no
    valid users = sc
    create mask = 0640
    force create mode = 0640
    directory mask = 0750
    force directory mode = 0750
